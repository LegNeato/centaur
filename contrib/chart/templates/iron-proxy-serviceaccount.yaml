{{- include "centaur.validateIronProxySecretSource" . }}
{{- if .Values.ironProxy.serviceAccount.create }}
# The identity of the per-sandbox and Code Mode iron-proxy pods. Its
# annotations can bind it to a cloud role. An AWS IAM role gives the
# aws-secrets-manager secret source its access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "centaur.ironProxyServiceAccountName" . }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "iron-proxy") | nindent 4 }}
{{- with .Values.ironProxy.serviceAccount.annotations }}
  annotations:
{{- toYaml . | nindent 4 }}
{{- end }}
automountServiceAccountToken: false
{{- end }}
