[package]
name = "centaur-zulipbot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zulip chat ingress for Centaur sessions"

[dependencies]
axum.workspace = true
base64.workspace = true
centaur-session-client.workspace = true
centaur-session-core.workspace = true
centaur-zulip.workspace = true
clap.workspace = true
regex.workspace = true
reqwest = { workspace = true, features = ["query"] }
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url.workspace = true
urlencoding.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
